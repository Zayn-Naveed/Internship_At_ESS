<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promises</title>
</head>
<body>
    <h1>Promises</h1>
    <h2>A Promise is an object that represents the eventual completion or failure of an asynchronous operation and its resulting value.</h2>
</body>
    <script>
        const jobApplication = new Promise((resolve, reject) =>{
            // let selected = true;
            let selected = false;

            if (selected){
                resolve("Congratulations! You are selected.");

            } else{
                reject("Better Luck next time.")
            }
        });

        jobApplication
        .then(result => console.log(result))
        .catch(error => console.log(error))
        .finally(() => console.log("Task Completed"));

    </script>
</html>
